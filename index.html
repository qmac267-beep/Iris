<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris 3D Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1f1f28;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Khung hiển thị cuộc trò chuyện & Nút bấm lựa chọn */
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            background: rgba(22, 22, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 184, 255, 0.25);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #chat-box {
            font-size: 14px;
            line-height: 1.5;
            color: #ffffff;
            max-height: 120px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 12px;
            border-radius: 10px;
            border-left: 3px solid #ffb8ff;
        }

        /* Danh sách nút câu hỏi lựa chọn */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .option-btn {
            padding: 10px 12px;
            border: 1px solid rgba(255, 184, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: rgba(255, 184, 255, 0.25);
            border-color: #ffb8ff;
            transform: translateY(-2px);
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
            "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.154.0/examples/jsm/loaders/GLTFLoader.js",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
        }
    }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="chat-container">
        <div id="chat-box"><b>Iris:</b> Xin chào bạn! Chọn câu hỏi bên dưới để trò chuyện cùng Iris nhé! ✨</div>
        <div id="options-container" class="options-grid"></div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
