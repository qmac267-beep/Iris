<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuki 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
    }

    /* --- 1. MÀN HÌNH LOADING --- */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0f0f13;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .loader-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 25px;
      letter-spacing: 1px;
      color: #e0e0e0;
    }

    .progress-bar-container {
      width: 320px;
      height: 12px;
      background-color: #2a2a35;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      border-radius: 6px;
      /* Thời gian chạy thanh nạp đúng 10s */
      transition: width 10s linear;
    }

    .loading-status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #888899;
    }

    /* --- 2. GIAO DIỆN CHÍNH (MAIN UI) --- */
    #main-ui {
      display: opacity;
      opacity: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: opacity 0.8s ease;
    }

    /* Header */
    .header {
      height: 60px;
      background-color: #242430;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #333344;
    }

    .logo {
      font-weight: bold;
      font-size: 1.2rem;
      color: #00f2fe;
    }

    .user-profile {
      font-size: 0.9rem;
      color: #ccc;
    }

    /* Bố cục nội dung chính */
    .container {
      display: flex;
      flex: 1;
    }

    /* Thanh điều hướng bên (Sidebar) */
    .sidebar {
      width: 220px;
      background-color: #1e1e28;
      padding: 20px 10px;
      border-right: 1px solid #333344;
    }

    .nav-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      border-radius: 6px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      background-color: #2a2a3d;
      color: #fff;
    }

    /* Khu vực hiển thị nội dung */
    .content {
      flex: 1;
      padding: 30px;
      background-color: #14141c;
      overflow-y: auto;
    }

    .card {
      background-color: #1e1e28;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #2d2d3d;
      max-width: 600px;
    }

    .card h2 {
      margin-bottom: 10px;
      color: #ffffff;
    }

    .card p {
      color: #aaa;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 1. MÀN HÌNH LOADING MẶC ĐỊNH 10s -->
  <div id="loading-screen">
    <div class="loader-title">Đang tải hệ thống...</div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="loading-status" id="loading-text">Vui lòng chờ (10s)...</div>
  </div>

  <!-- 2. GIAO DIỆN CHÍNH -->
  <div id="main-ui">
    <header class="header">
      <div class="logo">SYSTEM DASHBOARD</div>
      <div class="user-profile">Tài khoản: User</div>
    </header>

    <div class="container">
      <nav class="sidebar">
        <div class="nav-item active">Trang chủ</div>
        <div class="nav-item">Cấu hình</div>
        <div class="nav-item">Cài đặt</div>
      </nav>

      <main class="content">
        <div class="card">
          <h2>Chào mừng quay trở lại!</h2>
          <p>Hệ thống đã hoàn tất quá trình tải nội dung trong 10 giây và sẵn sàng sử dụng.</p>
        </div>
      </main>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const progressBar = document.getElementById('progress-bar');
      const loadingText = document.getElementById('loading-text');
      const loadingScreen = document.getElementById('loading-screen');
      const mainUI = document.getElementById('main-ui');

      // Bắt đầu chạy thanh Progress bar tới 100% trong 10s
      setTimeout(() => {
        progressBar.style.width = '100%';
      }, 50);

      // Đếm ngược giây hiển thị trên màn hình
      let secondsLeft = 10;
      const countdownInterval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          loadingText.innerText = `Vui lòng chờ (${secondsLeft}s)...`;
        } else {
          loadingText.innerText = 'Đang hoàn tất...';
          clearInterval(countdownInterval);
        }
      }, 1000);

      // Đúng 10 giây (10000ms) sẽ ẩn màn hình loading và hiện UI chính
      setTimeout(() => {
        // Ẩn màn hình loading
        loadingScreen.style.opacity = '0';
        loadingScreen.style.visibility = 'hidden';

        // Hiện giao diện chính
        mainUI.style.opacity = '1';
      }, 10000);
    });
  </script>

</body>
</html>
